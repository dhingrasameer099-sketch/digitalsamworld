<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgMeta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0720"/>
      <stop offset="60%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="blurMeta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgMeta)"/>
  <circle cx="180" cy="140" r="160" fill="#E11D48" opacity="0.35" filter="url(#blurMeta)"/>
  <circle cx="1040" cy="480" r="200" fill="#9333EA" opacity="0.25" filter="url(#blurMeta)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="380" height="42" rx="21" fill="rgba(244, 63, 94, 0.18)" stroke="#F43F5E" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#A855F7"/>
    <text x="42" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#FFE4E6" letter-spacing="1">DIGITALSAMWORLD • SOCIAL &amp; META ADS</text>
  </g>

  <!-- Headline -->
  <text x="80" y="200" font-family="'Outfit', system-ui, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Scale D2C Brands to 5.4x ROAS
  </text>
  <text x="80" y="265" font-family="'Outfit', system-ui, sans-serif" font-size="50" font-weight="800" fill="url(#roseGrad)" letter-spacing="-0.5">
    Using Meta Reels Creative Sprints
  </text>
  <text x="80" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">
    3-Second Pattern-Interrupt Hooks, Advantage+ &amp; Viral Creative Iterations
  </text>

  <!-- Right Visual: Reel Creative Testing -->
  <g transform="translate(750, 95)">
    <rect width="370" height="430" rx="28" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2"/>
    
    <!-- Reel Phone Header -->
    <rect x="35" y="30" width="300" height="180" rx="16" fill="rgba(88, 28, 135, 0.5)"/>
    <circle cx="185" cy="120" r="32" fill="rgba(244, 63, 94, 0.8)"/>
    <polygon points="178,106 178,134 200,120" fill="#FFFFFF"/>
    <text x="45" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F472B6">REEL VARIANT A &bull; 3S HOOK</text>
    <text x="45" y="195" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">"Stop Wasting Ad Budget On..."</text>

    <!-- Metrics -->
    <rect x="35" y="230" width="142" height="90" rx="12" fill="rgba(30, 41, 59, 0.7)"/>
    <text x="50" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">META ROAS</text>
    <text x="50" y="295" font-family="'Outfit', system-ui, sans-serif" font-size="30" font-weight="800" fill="#34D399">5.4x</text>

    <rect x="193" y="230" width="142" height="90" rx="12" fill="rgba(30, 41, 59, 0.7)"/>
    <text x="208" y="258" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">REVENUE</text>
    <text x="208" y="295" font-family="'Outfit', system-ui, sans-serif" font-size="30" font-weight="800" fill="#F43F5E">+290%</text>

    <rect x="35" y="340" width="300" height="40" rx="10" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-width="1"/>
    <text x="55" y="365" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDA4AF">&#10003; Velvet Loom Menswear Case Study</text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(80, 490)">
    <rect width="150" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="22" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">&#128197; Sep 15, 2026</text>
  </g>
  <g transform="translate(245, 490)">
    <rect width="130" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">&#9201; 5 Min Read</text>
  </g>
  <g transform="translate(390, 490)">
    <rect width="240" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">&#9998; Author: Sameer Malhotra</text>
  </g>

  <text x="80" y="580" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748B">
    digitalsamworld.com &bull; Performance Creative Production Studio &bull; Instagram &amp; Meta Ads
  </text>
</svg>
