<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPpc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="blurPpc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgPpc)"/>
  <circle cx="180" cy="140" r="160" fill="#059669" opacity="0.35" filter="url(#blurPpc)"/>
  <circle cx="1040" cy="480" r="200" fill="#10B981" opacity="0.25" filter="url(#blurPpc)"/>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="360" height="42" rx="21" fill="rgba(16, 185, 129, 0.18)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#FBBF24"/>
    <text x="42" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#A7F3D0" letter-spacing="1">DIGITALSAMWORLD • GOOGLE ADS &amp; PPC</text>
  </g>

  <!-- Headline -->
  <text x="80" y="200" font-family="'Outfit', system-ui, sans-serif" font-size="50" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
