  </text>

  <!-- Right Visual: Performance Dashboard Mockup -->
  <g transform="translate(730, 110)">
    <rect width="390" height="410" rx="20" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
    
    <rect x="25" y="25" width="340" height="85" rx="14" fill="rgba(6, 78, 59, 0.6)"/>
    <text x="45" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0">AVERAGE CLIENT ROAS</text>
    <text x="45" y="95" font-family="'Outfit', system-ui, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">4.8x – 6.2x</text>
    <text x="240" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399">&#9650; +145% YoY</text>

    <!-- Stat 2 -->
    <rect x="25" y="125" width="162" height="120" rx="14" fill="rgba(30, 41, 59, 0.7)"/>
    <text x="40" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">COST PER LEAD (CPL)</text>
    <text x="40" y="195" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="800" fill="#34D399">-52%</text>
    <text x="40" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#CBD5E1">Offline Conversion</text>

    <!-- Stat 3 -->
    <rect x="203" y="125" width="162" height="120" rx="14" fill="rgba(30, 41, 59, 0.7)"/>
    <text x="218" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8">AD SPEND MANAGED</text>
    <text x="218" y="195" font-family="'Outfit', system-ui, sans-serif" font-size="28" font-weight="800" fill="#FBBF24">₹25Cr+</text>
    <text x="218" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#CBD5E1">Google Certified</text>

    <!-- Chart Line -->
    <path d="M 45 350 Q 120 330, 180 290 T 340 270" fill="none" stroke="#10B981" stroke-width="4"/>
    <circle cx="340" cy="270" r="6" fill="#FBBF24"/>
    <text x="45" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">&#10003; Smart Bidding &amp; Negative Keyword Fortresses</text>
  </g>

  <!-- Bottom Pills -->
  <g transform="translate(80, 490)">
    <rect width="150" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="22" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">&#128197; Sep 26, 2026</text>
  </g>
  <g transform="translate(245, 490)">
    <rect width="130" height="40" rx="8" fill="rgba(255, 255, 255, 0.08)"/>
    <text x="20" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">&#9201; 5 Min Read</text>
  </g>
  <g transform="translate(390, 490)">
