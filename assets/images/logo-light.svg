<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="logoGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <rect x="2" y="4" width="56" height="56" rx="15" fill="url(#logoGradLight)" />
  <rect x="4" y="6" width="52" height="52" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
  <!-- World Orbital Ring -->
  <ellipse cx="30" cy="32" rx="18" ry="7.5" fill="none" stroke="url(#accentGradLight)" stroke-width="2.5" transform="rotate(-28 30 32)" stroke-linecap="round" />
  <!-- Stylized 'D' Monogram for Digital -->
  <path d="M20 19V45" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M20 19H29.5C36.4 19 42 24.8 42 32C42 39.2 36.4 45 29.5 45H20" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Glowing World Node -->
  <circle cx="37" cy="27" r="3" fill="#10B981" />
  
  <!-- Brand Typography for Astra Light Theme -->
  <text x="68" y="36" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0F172A" letter-spacing="-0.4">
    Digital<tspan fill="#2563EB">Sam</tspan><tspan fill="#10B981">World</tspan>
  </text>
  <text x="69" y="52" font-family="'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="2.8">
    DIGITAL MARKETING AGENCY
  </text>
</svg>
